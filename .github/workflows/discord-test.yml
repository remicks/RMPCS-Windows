name: Requested Discord test
on:
  push:
    branches: [main]
    paths: [.github/workflows/discord-test.yml]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: v0.12.1
      announce: true
      test_message: true
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
